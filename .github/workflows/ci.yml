name: CI

on:
  push:
    branches: [main, migrate/nextjs]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            astro-site/package-lock.json
      - run: npm ci
      # The parity tests import the original Astro libs, whose tsconfig extends
      # astro/tsconfigs/strict. Removed with astro-site/ in Phase 8.
      - name: Install astro-site deps for parity tests
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: astro-site
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
      - name: First-load JS per route (152 kB budget)
        run: node scripts/measure-first-load.mjs
